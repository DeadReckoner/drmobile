packages:
  - .

# Delay installs of freshly published packages (30 days = 43200 minutes).
minimumReleaseAge: 43200
minimumReleaseAgeStrict: true

# Prevent transitive dependencies from using exotic sources (git/tarball URLs).
blockExoticSubdeps: true

# Require explicit approval for dependency build/postinstall scripts.
strictDepBuilds: true
allowBuilds: {}
